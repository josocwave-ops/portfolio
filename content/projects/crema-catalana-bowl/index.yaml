intro: 'Glaze has always fascinated me for its strange, edible quality: smooth, glossy, and tempting even when empty. This bowl evokes the orange-hued memories of Catalan restaurants, where old lights and the murmur of conversation filled the air. The cracks and surface patterns echo both the texture of dessert and the lived-in quality of those moments.'
