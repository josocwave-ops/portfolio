intro: This collection investigates decay and growth through the lens of mould. One piece appears almost devoured, raw clay exposed beneath spreading redness inspired by mouldy strawberries. The second is carved and covered, fully “grown,” yet new forms push through the surface. Together they explore impermanence and transformation through destruction.
