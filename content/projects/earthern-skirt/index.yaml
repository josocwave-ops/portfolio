intro: 'My first full garment, developed through research into how clothing is shaped by geography and culture. I was particularly inspired by Romani dress: layered skirts and the way fabric carries movement, history, and place. Made from discarded fabrics sourced from donation bins, it was shown and sold at a school sustainability event to raise money for charity.'
