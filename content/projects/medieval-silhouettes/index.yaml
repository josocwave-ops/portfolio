intro: This project emerged from an interest in folklore, fantasy, and medieval silhouettes, particularly the dreamy, dark softness of worlds like Maleficent. Created during a two-week intensive, designing for another body pushed me to think about movement, structure, and how garments transform when worn. The runway became an extension of the design, where fabric, body, and motion completed the work.
