intro: 'This is my capstone, an ongoing project, the work I''ve chosen to mark the end of my high school journey. I thought about memory: about how countless memories exist in my life, yet there are eight I can''t stop returning to, eight that take over my mind with such vivid detail I can see every shadow, hear every sound, feel every texture. From age five to seventeen, these moments have quietly shaped me, and now they are demanding to be made visible.'
