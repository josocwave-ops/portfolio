intro: This collection began with discarded sweaters and thrifted garments, which I unravelled and transformed into new crochet pieces. Undoing and rebuilding informed the visual language, drawing from rust, erosion, and organic overgrowth. The final beach photoshoot became an extension of the project, where weathered materials, natural light, and movement echoed the themes of decay and regeneration.
