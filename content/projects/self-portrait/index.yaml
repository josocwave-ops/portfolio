intro: 'This self-portrait was the first painting I ever completed, a conscious decision to confront my fear of painting by turning the subject inward. Working in gouache with a CMY palette, I aimed for a face that feels unsettled rather than obviously expressive: wide eyes looking beyond the viewer, a restrained smile, an expression that suggests thought rather than clarity.'
