name: Ona Cabedo Wells
description: Ceramics, writing, drawing and fashion by Ona Cabedo Wells.
about:
  heading: hi, i'm ona
  body: |-
    I make things with clay, fabric, paint and words. Most of my work starts with a memory, a place, or a mistake I decided to keep.

    My ceramics range from mugs with poems carved into them to sculptural faces; my clothes are built from discarded fabric and unravelled sweaters; and I draw and paint in between.

    I also run a small ceramics studio, Clay by Ona, where some of my pieces are for sale.
